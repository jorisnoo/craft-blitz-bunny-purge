name: Tests

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer validate --no-check-publish --no-plugins
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit --no-plugins
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/pest

  required:
    name: Package checks
    runs-on: ubuntu-latest
    needs: tests
    if: ${{ always() }}
    steps:
      - run: test "$MATRIX_RESULT" = success
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
